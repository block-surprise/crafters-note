<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>エンチャント一覧</title>

<style>
body{
    margin:0;
    background:#f5f5f5;
    font-family:Arial,sans-serif;
}

header{
    background:#512da8;
    color:white;
    text-align:center;
    padding:40px;
}

.container{
    width:90%;
    max-width:1000px;
    margin:30px auto;
}

.card{
    background:white;
    margin-bottom:20px;
    padding:20px;
    border-radius:12px;
    box-shadow:0 2px 8px rgba(0,0,0,.1);
}

.level{
    color:#673ab7;
    font-weight:bold;
}
</style>
</head>

<body>

<header>
<h1>⚔ エンチャント一覧</h1>
<p>おすすめエンチャントを解説</p>
</header>

<div class="container">

<div class="card">
<h2>効率強化</h2>
<p class="level">最大レベル V</p>
<p>ツールの採掘速度が上昇する。</p>
</div>

<div class="card">
<h2>耐久力</h2>
<p class="level">最大レベル III</p>
<p>道具が壊れにくくなる。</p>
</div>

<div class="card">
<h2>修繕</h2>
<p class="level">最大レベル I</p>
<p>経験値で耐久値を回復できる。</p>
</div>

<div class="card">
<h2>鋭さ</h2>
<p class="level">最大レベル V</p>
<p>近接攻撃ダメージを増加。</p>
</div>

<div class="card">
<h2>無限</h2>
<p class="level">最大レベル I</p>
<p>矢を1本持っていれば撃ち放題。</p>
</div>

</div>

</body>
</html>
