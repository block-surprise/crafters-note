<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>建築アイデア集 | Minecraft攻略ベース</title>

<style>
body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#f5f5f5;
}

header{
    background:#8d6e63;
    color:white;
    text-align:center;
    padding:40px;
}

.container{
    width:90%;
    max-width:1200px;
    margin:30px auto;
}

.grid{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(300px,1fr));
    gap:25px;
}

.card{
    background:white;
    border-radius:15px;
    overflow:hidden;
    box-shadow:0 2px 10px rgba(0,0,0,.1);
}

.image{
    height:180px;
    background:#c8c8c8;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:60px;
}

.content{
    padding:20px;
}

.content h2{
    margin-top:0;
    color:#5d4037;
}

.tag{
    display:inline-block;
    background:#8d6e63;
    color:white;
    padding:5px 10px;
    border-radius:20px;
    font-size:14px;
    margin-bottom:10px;
}

footer{
    text-align:center;
    padding:25px;
    color:#666;
}
</style>

</head>
<body>

<header>
<h1>🏗️ 建築アイデア集</h1>
<p>家づくりや街づくりの参考にしよう！</p>
</header>

<div class="container">

<div class="grid">

<div class="card">
<div class="image">🏠</div>
<div class="content">
<span class="tag">初心者向け</span>
<h2>木のサバイバルハウス</h2>
<p>
序盤に作れる定番の家。
木材中心なので素材集めも簡単。
</p>
</div>
</div>

<div class="card">
<div class="image">🏡</div>
<div class="content">
<span class="tag">人気</span>
<h2>おしゃれな村風ハウス</h2>
<p>
木材と石を組み合わせた
見栄えの良い住宅。
</p>
</div>
</div>

<div class="card">
<div class="image">🏰</div>
<div class="content">
<span class="tag">上級者向け</span>
<h2>中世の城</h2>
<p>
巨大な拠点を作りたい人向け。
石レンガが大量に必要。
</p>
</div>
</div>

<div class="card">
<div class="image">🌾</div>
<div class="content">
<span class="tag">実用的</span>
<h2>農場エリア</h2>
<p>
畑や動物小屋をまとめた
生活拠点。
</p>
</div>
</div>

<div class="card">
<div class="image">⚓</div>
<div class="content">
<span class="tag">チャレンジ</span>
<h2>港町</h2>
<p>
船や倉庫を並べて
雰囲気のある街を作れる。
</p>
</div>
</div>

<div class="card">
<div class="image">🌸</div>
<div class="content">
<span class="tag">和風</span>
<h2>和風建築</h2>
<p>
桜バイオームにも合う
人気の建築スタイル。
</p>
</div>
</div>

</div>

</div>

<footer>
© Minecraft攻略ベース
</footer>

</body>
</html>
